name: Java Orders API

on:
  push:
    paths:
      - "java-orders-api/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java-orders-api/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-orders-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-orders-api/pom.xml

      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            java-orders-api/target/surefire-reports/
            java-orders-api/target/site/jacoco/
          if-no-files-found: ignore
