name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'fullstack-task-board/**'
      - 'playwright-e2e-suite/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'fullstack-task-board/**'
      - 'playwright-e2e-suite/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            fullstack-task-board/package-lock.json
            playwright-e2e-suite/package-lock.json

      - name: Install app dependencies
        working-directory: fullstack-task-board
        run: npm ci

      - name: Install e2e dependencies
        working-directory: playwright-e2e-suite
        run: npm ci

      - name: Install Chromium
        working-directory: playwright-e2e-suite
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: playwright-e2e-suite
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-e2e-suite/playwright-report/
          retention-days: 14

      - name: Upload traces and failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playwright-e2e-suite/test-results/
          retention-days: 7
