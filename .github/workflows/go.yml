name: go-rate-limiter
on:
  push:
    paths: ["go-rate-limiter/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go-rate-limiter/**", ".github/workflows/go.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-rate-limiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
