name: fullstack-task-board

on:
  push:
    branches: [main]
    paths:
      - 'fullstack-task-board/**'
      - '.github/workflows/fullstack.yml'
  pull_request:
    paths:
      - 'fullstack-task-board/**'
      - '.github/workflows/fullstack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fullstack-task-board
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstack-task-board/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
