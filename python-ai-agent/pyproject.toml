[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "support-agent"
version = "0.1.0"
description = "A tool-calling customer support agent with retrieval, testable without any API key."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrei Zagainov" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
dev = [
    "support-agent[api]",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # Emitted by newer Starlette releases about its own test client transport.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
